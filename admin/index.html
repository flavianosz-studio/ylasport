<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YLASPORT Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #3dba7e; --green-dark: #2a9a64; --green-light: #e8f9f1;
    --white: #ffffff; --gray-50: #f9f9f7; --gray-100: #f0efeb;
    --gray-200: #e0dfd9; --gray-400: #999890; --gray-600: #5a5950; --gray-900: #1a1a18;
    --red: #e53e3e; --red-light: #fff5f5;
    --font-display: 'Barlow Condensed', sans-serif; --font-body: 'Barlow', sans-serif;
    --radius: 10px; --radius-lg: 16px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07); --shadow-md: 0 4px 24px rgba(0,0,0,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--gray-50); color: var(--gray-900); }

  /* ── LOGIN ── */
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--white); border: 1.5px solid var(--gray-200); border-radius: var(--radius-lg); padding: 48px 40px; width: 100%; max-width: 400px; box-shadow: var(--shadow-md); }
  .login-logo { font-family: var(--font-display); font-size: 32px; letter-spacing: 3px; font-weight: 800; text-align: center; margin-bottom: 8px; }
  .login-logo span { color: var(--green); }
  .login-sub { text-align: center; font-size: 12px; color: var(--gray-400); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 32px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 11px; font-weight: 700; color: var(--gray-600); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .field input { width: 100%; border: 1.5px solid var(--gray-200); border-radius: var(--radius); padding: 10px 14px; font-size: 14px; font-family: var(--font-body); outline: none; transition: border .15s; background: var(--gray-50); }
  .field input:focus { border-color: var(--green); background: var(--white); }
  .btn-primary { width: 100%; background: var(--green); color: var(--white); border: none; border-radius: var(--radius); padding: 12px; font-size: 14px; font-weight: 700; font-family: var(--font-body); cursor: pointer; transition: background .15s; text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-msg { background: var(--red-light); border: 1px solid #feb2b2; color: var(--red); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; }

  /* ── ADMIN LAYOUT ── */
  #admin-screen { display: none; }
  .admin-header { background: var(--gray-900); color: var(--white); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .admin-logo { font-family: var(--font-display); font-size: 22px; letter-spacing: 3px; font-weight: 800; }
  .admin-logo span { color: var(--green); }
  .admin-user { font-size: 12px; color: var(--gray-400); display: flex; align-items: center; gap: 12px; }
  .btn-logout { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: var(--white); border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; font-family: var(--font-body); transition: background .15s; }
  .btn-logout:hover { background: rgba(255,255,255,0.2); }

  .admin-body { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
  .admin-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .admin-title { font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }

  .btn-action { background: var(--green); color: var(--white); border: none; border-radius: var(--radius); padding: 10px 20px; font-size: 13px; font-weight: 700; font-family: var(--font-body); cursor: pointer; transition: background .15s; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn-action:hover { background: var(--green-dark); }
  .btn-danger { background: var(--red); }
  .btn-danger:hover { background: #c53030; }
  .btn-secondary { background: var(--gray-100); color: var(--gray-900); border: 1.5px solid var(--gray-200); }
  .btn-secondary:hover { background: var(--gray-200); }

  /* ── ALBUMS LIST ── */
  .album-list { display: grid; gap: 12px; }
  .album-row { background: var(--white); border: 1.5px solid var(--gray-200); border-radius: var(--radius-lg); padding: 16px 20px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow); }
  .album-row-thumb { width: 60px; height: 60px; border-radius: var(--radius); overflow: hidden; background: var(--gray-100); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .album-row-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .album-row-info { flex: 1; min-width: 0; }
  .album-row-name { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .album-row-meta { font-size: 12px; color: var(--gray-400); margin-top: 3px; }
  .album-row-actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* ── MODAL ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--white); border-radius: var(--radius-lg); width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-md); }
  .modal-header { padding: 20px 24px 16px; border-bottom: 1.5px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
  .modal-close { background: var(--gray-100); border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .modal-body { padding: 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1.5px solid var(--gray-200); display: flex; gap: 10px; justify-content: flex-end; }

  /* ── UPLOAD AREA ── */
  .upload-area { border: 2px dashed var(--gray-200); border-radius: var(--radius-lg); padding: 32px; text-align: center; cursor: pointer; transition: all .2s; background: var(--gray-50); }
  .upload-area:hover, .upload-area.drag { border-color: var(--green); background: var(--green-light); }
  .upload-area .up-icon { font-size: 36px; margin-bottom: 10px; }
  .upload-area p { font-size: 14px; color: var(--gray-600); }
  .upload-area span { font-size: 12px; color: var(--gray-400); }
  #file-input { display: none; }

  .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 16px; }
  .preview-item { position: relative; border-radius: var(--radius); overflow: hidden; border: 1.5px solid var(--gray-200); aspect-ratio: 1; background: var(--gray-100); }
  .preview-item img, .preview-item video { width: 100%; height: 100%; object-fit: cover; }
  .preview-remove { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .preview-cover-btn { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 10px; font-weight: 700; }
  .preview-cover-btn.active { background: var(--green); }

  /* ── PROGRESS ── */
  .progress-bar { background: var(--gray-100); border-radius: 20px; height: 8px; overflow: hidden; margin-top: 12px; }
  .progress-fill { background: var(--green); height: 100%; border-radius: 20px; transition: width .3s; width: 0; }
  .progress-text { font-size: 12px; color: var(--gray-600); margin-top: 6px; }

  /* ── TOAST ── */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--gray-900); color: var(--white); border-radius: var(--radius); padding: 12px 20px; font-size: 13px; font-weight: 500; z-index: 9999; opacity: 0; transform: translateY(10px); transition: all .3s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: var(--green-dark); }
  .toast.error { background: var(--red); }

  .loading-spinner { display: flex; align-items: center; justify-content: center; padding: 60px; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--gray-200); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .status-badge.saving { background: #fef3c7; color: #92400e; }
  .status-badge.saved { background: var(--green-light); color: var(--green-dark); }
</style>
</head>

<script>
// ══════════════════════════════════════════════════════════════════
// ⚙️  CONFIGURAÇÕES — preencha antes de usar
// ══════════════════════════════════════════════════════════════════

// 1. Supabase (só para login/auth — sem storage, sem banco de dados)
const SUPABASE_URL = 'https://whzezjmjcnukixkkmyan.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndoemV6am1qY251a2l4a2tteWFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMDExMTgsImV4cCI6MjA5Mjg3NzExOH0.NwynrNjmxDX6rXuDB9hjmQHLNGam9aqb3QIc8Gw7PsE';

// 2. GitHub — onde ficam as fotos e o data.json
const GITHUB_TOKEN  = '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';
const GITHUB_OWNER  = 'flavianosz-studio';
const GITHUB_REPO   = 'ylasport';
const GITHUB_BRANCH = 'main';

// ══════════════════════════════════════════════════════════════════

// Supabase removido — usando apenas GitHub

// ─── STATE ────────────────────────────────────────────────────────
let localData = { albums: [] };        // dados em memória
let editingAlbumId = null;             // álbum sendo editado
let pendingFiles = [];                 // arquivos aguardando upload (novo álbum)
let pendingFiles2 = [];                // arquivos aguardando upload (editar álbum)
let coverMediaId = null;               // capa selecionada (novo álbum)
let currentPhotosAlbumId = null;       // álbum aberto no modal de fotos

// ─── AUTENTICAÇÃO ─────────────────────────────────────────────────
// Hash SHA256 da senha (a senha real não fica exposta no código)
// Senha atual: (protegida)
// Para trocar: gere um novo hash em: https://emn178.github.io/online-tools/sha256.html
const ADMIN_HASH = '36f8d3cfbf212f1beff9b3f6d992a96f6a2b2ea1257c0a2ba71e56146fc6bc00';

async function hashStr(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function doLogin() {
  const pass = document.getElementById('login-password').value;
  const err  = document.getElementById('login-error');
  err.style.display = 'none';
  if (!pass) { showError('Digite a senha.'); return; }
  const h = await hashStr(pass);
  if (h !== ADMIN_HASH) { showError('Senha incorreta.'); return; }
  sessionStorage.setItem('yla_admin', '1');
  enterAdmin();
}
function doLogout() {
  sessionStorage.removeItem('yla_admin');
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}
function showError(msg) {

}
async function enterAdmin() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'block';
  document.getElementById('admin-email-display').textContent = 'Admin';
  await loadData();
}
document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ─── GITHUB API ───────────────────────────────────────────────────
const GH_API = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents`;
const GH_HEADERS = () => ({
  'Authorization': `Bearer ${GITHUB_TOKEN}`,
  'Accept': 'application/vnd.github.v3+json',
  'Content-Type': 'application/json'
});

async function ghGet(path) {
  const r = await fetch(`${GH_API}/${path}?ref=${GITHUB_BRANCH}`, { headers: GH_HEADERS() });
  if (!r.ok) return null;
  return r.json();
}

async function ghPut(path, content, message, sha) {
  const body = { message, content: btoa(unescape(encodeURIComponent(content))), branch: GITHUB_BRANCH };
  if (sha) body.sha = sha;
  const r = await fetch(`${GH_API}/${path}`, { method: 'PUT', headers: GH_HEADERS(), body: JSON.stringify(body) });
  return r.ok;
}

async function ghPutBinary(path, base64Content, message, sha) {
  const body = { message, content: base64Content, branch: GITHUB_BRANCH };
  if (sha) body.sha = sha;
  const r = await fetch(`${GH_API}/${path}`, { method: 'PUT', headers: GH_HEADERS(), body: JSON.stringify(body) });
  return r.json();
}

async function ghDelete(path, message, sha) {
  const body = { message, sha, branch: GITHUB_BRANCH };
  const r = await fetch(`${GH_API}/${path}`, { method: 'DELETE', headers: GH_HEADERS(), body: JSON.stringify(body) });
  return r.ok;
}

// ─── DATA.JSON ────────────────────────────────────────────────────
async function loadData() {
  document.getElementById('admin-loading').style.display = 'flex';
  document.getElementById('admin-album-list').style.display = 'none';
  try {
    const file = await ghGet('data.json');
    if (file) {
      const content = decodeURIComponent(escape(atob(file.content.replace(/\n/g,''))));
      localData = JSON.parse(content);
    } else {
      localData = { albums: [] };
      await saveData('Inicializar data.json');
    }
  } catch(e) { localData = { albums: [] }; }
  renderAdminAlbums();
}

async function saveData(msg = 'Atualizar álbuns') {
  setSaveStatus('saving');
  const file = await ghGet('data.json');
  const sha = file ? file.sha : undefined;
  const json = JSON.stringify(localData, null, 2);
  const ok = await ghPut('data.json', json, msg, sha);
  setSaveStatus(ok ? 'saved' : 'error');
  return ok;
}

function setSaveStatus(s) {
  const el = document.getElementById('save-status');
  el.style.display = 'inline-block';
  if (s === 'saving') { el.className = 'status-badge saving'; el.textContent = '⏳ Salvando...'; }
  else if (s === 'saved') { el.className = 'status-badge saved'; el.textContent = '✅ Salvo'; setTimeout(() => el.style.display='none', 3000); }
  else { el.className = 'status-badge'; el.style.background='#fee'; el.style.color='#c00'; el.textContent = '❌ Erro ao salvar'; }
}

// ─── UPLOAD DE ARQUIVO PARA GITHUB ────────────────────────────────
function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function uploadFileToGitHub(file, albumId) {
  const ext = file.name.split('.').pop();
  const id = Date.now() + '_' + Math.random().toString(36).slice(2,8);
  const path = `media/${albumId}/${id}.${ext}`;
  const b64 = await fileToBase64(file);
  const result = await ghPutBinary(path, b64, `Upload: ${file.name}`, undefined);
  if (!result || !result.content) return null;
  const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path}`;
  return { id, url, type: file.type.startsWith('video') ? 'video' : 'image', path };
}

// ─── RENDER ÁLBUNS ADMIN ──────────────────────────────────────────
function renderAdminAlbums() {
  document.getElementById('admin-loading').style.display = 'none';
  const list = document.getElementById('admin-album-list');
  const empty = document.getElementById('admin-empty');
  const albums = localData.albums || [];
  if (!albums.length) { list.style.display='none'; empty.style.display='block'; return; }
  empty.style.display = 'none';
  list.style.display = 'grid';
  list.innerHTML = albums.map(a => {
    const media = a.media || [];
    const cover = media.find(m => m.id === a.cover_media_id) || media.find(m => m.type === 'image');
    const thumb = cover ? `<img src="${cover.url}" alt="">` : '📁';
    return `<div class="album-row">
      <div class="album-row-thumb">${thumb}</div>
      <div class="album-row-info">
        <div class="album-row-name">${esc(a.name)}</div>
        <div class="album-row-meta">${media.length} mídia${media.length!==1?'s':''} ${a.tag ? '· '+esc(a.tag) : ''}</div>
      </div>
      <div class="album-row-actions">
        <button class="btn-action btn-secondary" style="padding:8px 14px;font-size:12px" onclick="openPhotosModal('${a.id}')">📷 Fotos</button>
        <button class="btn-action btn-secondary" style="padding:8px 14px;font-size:12px" onclick="editAlbum('${a.id}')">✏️ Editar</button>
        <button class="btn-action btn-danger" style="padding:8px 14px;font-size:12px" onclick="deleteAlbum('${a.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

// ─── MODAL NOVO ÁLBUM ─────────────────────────────────────────────
function openNewAlbumModal() {
  editingAlbumId = null; pendingFiles = []; coverMediaId = null;
  document.getElementById('modal-title').textContent = 'Novo Álbum';
  document.getElementById('f-name').value = '';
  document.getElementById('f-tag').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-pay').value = '';
  document.getElementById('preview-grid').innerHTML = '';
  document.getElementById('upload-progress').style.display = 'none';
  openModal('album-modal');
}

function editAlbum(id) {
  const alb = localData.albums.find(a => a.id === id);
  if (!alb) return;
  editingAlbumId = id; pendingFiles = []; coverMediaId = alb.cover_media_id;
  document.getElementById('modal-title').textContent = 'Editar Álbum';
  document.getElementById('f-name').value = alb.name || '';
  document.getElementById('f-tag').value = alb.tag || '';
  document.getElementById('f-desc').value = alb.description || '';
  document.getElementById('f-pay').value = alb.pay_link || '';
  // Mostrar mídias existentes
  const grid = document.getElementById('preview-grid');
  grid.innerHTML = (alb.media || []).map(m => existingMediaHTML(m, 'pendingFiles', id)).join('');
  openModal('album-modal');
}

function existingMediaHTML(m, ctx, albumId) {
  const isCover = m.id === coverMediaId;
  const preview = m.type === 'video'
    ? `<video src="${m.url}" muted></video>`
    : `<img src="${m.url}" alt="">`;
  return `<div class="preview-item" id="prev-${m.id}">
    ${preview}
    <button class="preview-remove" onclick="removeExistingMedia('${m.id}','${albumId}')">✕</button>
    <button class="preview-cover-btn ${isCover?'active':''}" onclick="setCover('${m.id}','${albumId || editingAlbumId}',this)">⭐</button>
  </div>`;
}

function setCover(mediaId, albumId, btn) {
  coverMediaId = mediaId;
  document.querySelectorAll('.preview-cover-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (albumId) {
    const alb = localData.albums.find(a => a.id === albumId);
    if (alb) { alb.cover_media_id = mediaId; saveData('Atualizar capa'); }
  }
}

async function removeExistingMedia(mediaId, albumId) {
  if (!confirm('Remover esta mídia?')) return;
  const alb = localData.albums.find(a => a.id === albumId);
  if (!alb) return;
  const m = (alb.media || []).find(x => x.id === mediaId);
  if (m && m.path) {
    const file = await ghGet(m.path);
    if (file) await ghDelete(m.path, `Remover mídia: ${mediaId}`, file.sha);
  }
  alb.media = (alb.media || []).filter(x => x.id !== mediaId);
  if (alb.cover_media_id === mediaId) alb.cover_media_id = null;
  document.getElementById('prev-' + mediaId)?.remove();
  await saveData('Remover mídia');
  renderAdminAlbums();
  toast('Mídia removida', 'success');
}

// ─── UPLOAD HANDLER ───────────────────────────────────────────────
function handleFiles(files) {
  for (const f of files) {
    if (f.size > 10 * 1024 * 1024) { toast(`${f.name} excede 10MB`, 'error'); continue; }
    pendingFiles.push(f);
    addPreview(f, pendingFiles.length - 1);
  }
}
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('upload-area').classList.remove('drag');
  handleFiles(e.dataTransfer.files);
}
function addPreview(file, idx) {
  const grid = document.getElementById('preview-grid');
  const div = document.createElement('div');
  div.className = 'preview-item'; div.id = `pf-${idx}`;
  const url = URL.createObjectURL(file);
  div.innerHTML = file.type.startsWith('video')
    ? `<video src="${url}" muted></video>`
    : `<img src="${url}" alt="">`;
  div.innerHTML += `<button class="preview-remove" onclick="removePending(${idx})">✕</button>
    <button class="preview-cover-btn" onclick="setPendingCover(${idx},this)">⭐</button>`;
  grid.appendChild(div);
}
function removePending(idx) {
  pendingFiles[idx] = null;
  document.getElementById(`pf-${idx}`)?.remove();
}
function setPendingCover(idx, btn) {
  document.querySelectorAll('.preview-cover-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  coverMediaId = `pending_${idx}`;
}

// ─── SALVAR ÁLBUM ─────────────────────────────────────────────────
async function saveAlbum() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('Nome do álbum é obrigatório', 'error'); return; }
  const btn = document.getElementById('save-album-btn');
  btn.disabled = true; btn.textContent = 'Salvando...';

  const files = pendingFiles.filter(Boolean);
  let albumId = editingAlbumId || (Date.now().toString());
  let alb = localData.albums.find(a => a.id === albumId);
  if (!alb) {
    alb = { id: albumId, name, tag: '', description: '', pay_link: '', cover_media_id: null, created_at: new Date().toISOString(), media: [] };
    localData.albums.unshift(alb);
  }
  alb.name = name;
  alb.tag = document.getElementById('f-tag').value.trim();
  alb.description = document.getElementById('f-desc').value.trim();
  alb.pay_link = document.getElementById('f-pay').value.trim();

  // Upload dos arquivos
  if (files.length) {
    document.getElementById('upload-progress').style.display = 'block';
    for (let i = 0; i < files.length; i++) {
      document.getElementById('progress-fill').style.width = `${Math.round((i/files.length)*100)}%`;
      document.getElementById('progress-text').textContent = `Enviando ${i+1} de ${files.length}...`;
      const result = await uploadFileToGitHub(files[i], albumId);
      if (result) {
        alb.media = alb.media || [];
        alb.media.push(result);
        // Define capa se selecionada ou se é a primeira
        if (coverMediaId === `pending_${pendingFiles.indexOf(files[i])}` || (!alb.cover_media_id && result.type === 'image')) {
          alb.cover_media_id = result.id;
        }
      }
    }
    document.getElementById('progress-fill').style.width = '100%';
    document.getElementById('progress-text').textContent = 'Upload completo!';
  }

  await saveData(editingAlbumId ? 'Editar álbum' : 'Novo álbum');
  renderAdminAlbums();
  closeModal('album-modal');
  btn.disabled = false; btn.textContent = 'Salvar Álbum';
  toast(editingAlbumId ? 'Álbum atualizado!' : 'Álbum criado!', 'success');
}

// ─── MODAL FOTOS ──────────────────────────────────────────────────
function openPhotosModal(albumId) {
  currentPhotosAlbumId = albumId;
  const alb = localData.albums.find(a => a.id === albumId);
  document.getElementById('photos-modal-title').textContent = alb ? alb.name.toUpperCase() : 'Fotos';
  const grid = document.getElementById('existing-photos-grid');
  grid.innerHTML = (alb?.media || []).map(m => existingMediaHTML(m, 'photos', albumId)).join('');
  pendingFiles2 = [];
  document.getElementById('upload-progress2').style.display = 'none';
  openModal('photos-modal');
}
function handleFiles2(files) {
  const albumId = currentPhotosAlbumId;
  for (const f of files) {
    if (f.size > 10 * 1024 * 1024) { toast(`${f.name} excede 10MB`, 'error'); continue; }
    pendingFiles2.push({ file: f, albumId });
    uploadSingle(f, albumId);
  }
}
function handleDrop2(e) {
  e.preventDefault();
  handleFiles2(e.dataTransfer.files);
}
async function uploadSingle(file, albumId) {
  const prog = document.getElementById('upload-progress2');
  prog.style.display = 'block';
  document.getElementById('progress-text2').textContent = `Enviando ${file.name}...`;
  const result = await uploadFileToGitHub(file, albumId);
  if (result) {
    const alb = localData.albums.find(a => a.id === albumId);
    if (alb) {
      alb.media = alb.media || [];
      alb.media.push(result);
      if (!alb.cover_media_id && result.type === 'image') alb.cover_media_id = result.id;
      await saveData('Adicionar mídia');
      const grid = document.getElementById('existing-photos-grid');
      const div = document.createElement('div');
      div.innerHTML = existingMediaHTML(result, 'photos', albumId);
      grid.appendChild(div.firstChild);
      renderAdminAlbums();
      toast('Foto enviada!', 'success');
    }
  } else {
    toast('Erro ao enviar ' + file.name, 'error');
  }
  prog.style.display = 'none';
}

// ─── DELETAR ÁLBUM ────────────────────────────────────────────────
async function deleteAlbum(id) {
  if (!confirm('Deletar este álbum e todas as fotos? Esta ação não pode ser desfeita.')) return;
  const alb = localData.albums.find(a => a.id === id);
  if (!alb) return;
  // Deletar arquivos do GitHub
  for (const m of (alb.media || [])) {
    if (m.path) {
      const file = await ghGet(m.path);
      if (file) await ghDelete(m.path, `Remover mídia: ${m.id}`, file.sha);
    }
  }
  localData.albums = localData.albums.filter(a => a.id !== id);
  await saveData('Deletar álbum');
  renderAdminAlbums();
  toast('Álbum deletado', 'success');
}

// ─── MODAL HELPERS ────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ─── TOAST ────────────────────────────────────────────────────────
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ─── HELPERS ──────────────────────────────────────────────────────
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ─── INIT ─────────────────────────────────────────────────────────
// Verificar sessão salva
if (sessionStorage.getItem('yla_admin') === '1') { enterAdmin(); }
</script>
